name: Flutter CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FLUTTER_VERSION: '3.38.2'

jobs:
  # ===== ANALYZE & TEST =====
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create .env file
        shell: bash
        run: |
          echo "Preparing .env for CI..."
          : "${SUPABASE_URL:=}"
          : "${SUPABASE_ANON_KEY:=}"
          if [[ -n "${SUPABASE_URL}" || -n "${SUPABASE_ANON_KEY}" ]]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env
            echo "Wrote .env from provided secrets."
          elif [[ -f .env.example ]]; then
            cp .env.example .env
            echo "Using .env.example fallback for CI."
          else
            printf "SUPABASE_URL=\nSUPABASE_ANON_KEY=\n" > .env
            echo "Created empty .env placeholder for CI."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # ===== BUILD ANDROID =====
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create .env file
        shell: bash
        run: |
          echo "Preparing .env for CI..."
          : "${SUPABASE_URL:=}"
          : "${SUPABASE_ANON_KEY:=}"
          if [[ -n "${SUPABASE_URL}" || -n "${SUPABASE_ANON_KEY}" ]]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env
            echo "Wrote .env from provided secrets."
          elif [[ -f .env.example ]]; then
            cp .env.example .env
            echo "Using .env.example fallback for CI."
          else
            printf "SUPABASE_URL=\nSUPABASE_ANON_KEY=\n" > .env
            echo "Created empty .env placeholder for CI."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ===== BUILD iOS (Optional - requires macOS runner) =====
  build_ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create .env file
        shell: bash
        run: |
          echo "Preparing .env for CI..."
          : "${SUPABASE_URL:=}"
          : "${SUPABASE_ANON_KEY:=}"
          if [[ -n "${SUPABASE_URL}" || -n "${SUPABASE_ANON_KEY}" ]]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env
            echo "Wrote .env from provided secrets."
          elif [[ -f .env.example ]]; then
            cp .env.example .env
            echo "Using .env.example fallback for CI."
          else
            printf "SUPABASE_URL=\nSUPABASE_ANON_KEY=\n" > .env
            echo "Created empty .env placeholder for CI."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: build/ios/iphoneos/Runner.app
