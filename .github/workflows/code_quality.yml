name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: 'stable'

      - name: Create .env file
        shell: bash
        run: |
          echo "Preparing .env for CI..."
          : "${SUPABASE_URL:=}"
          : "${SUPABASE_ANON_KEY:=}"
          if [[ -n "${SUPABASE_URL}" || -n "${SUPABASE_ANON_KEY}" ]]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env
            echo "Wrote .env from provided secrets."
          elif [[ -f .env.example ]]; then
            cp .env.example .env
            echo "Using .env.example fallback for CI."
          else
            printf "SUPABASE_URL=\nSUPABASE_ANON_KEY=\n" > .env
            echo "Created empty .env placeholder for CI."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Verify formatting
        run: dart format --set-exit-if-changed .
      
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      
      - name: Run tests
        run: flutter test
  
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: 'stable'

      - name: Create .env file
        shell: bash
        run: |
          echo "Preparing .env for CI..."
          : "${SUPABASE_URL:=}"
          : "${SUPABASE_ANON_KEY:=}"
          if [[ -n "${SUPABASE_URL}" || -n "${SUPABASE_ANON_KEY}" ]]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env
            echo "Wrote .env from provided secrets."
          elif [[ -f .env.example ]]; then
            cp .env.example .env
            echo "Using .env.example fallback for CI."
          else
            printf "SUPABASE_URL=\nSUPABASE_ANON_KEY=\n" > .env
            echo "Created empty .env placeholder for CI."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --debug
